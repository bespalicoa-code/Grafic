<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskurile mele</title>

<style>
:root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #171923;
    --muted: #777d8d;
    --line: #e8eaf0;
    --primary: #5b5cf0;
    --primary2: #7778ff;
    --green: #20a464;
    --red: #e5484d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #f7f8fc, #eef0ff);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 30px 20px 50px;
}

/* HEADER */

header {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #191c2b, #30345a);
    color: white;
    border-radius: 28px;
    padding: 30px;
    margin-bottom: 20px;
    box-shadow: 0 18px 45px #25284b22;
}

header h1 {
    margin: 0 0 8px;
    font-size: 35px;
}

.date {
    color: #cdd1e5;
}

.progress {
    height: 9px;
    background: #ffffff25;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 25px;
}

.bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, white, #aaaaff);
    transition: 0.3s;
}

#progressText {
    margin-top: 9px;
    color: #d7d9e8;
}

/* CARD */

.card {
    background: rgba(255,255,255,.95);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px #1e244010;
}

.card h3 {
    margin-top: 0;
}

/* ADD TASK */

.add {
    display: flex;
    gap: 10px;
}

.add input {
    flex: 1;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 16px;
    outline: none;
}

.add input:focus {
    border-color: var(--primary);
}

button {
    border: 0;
    cursor: pointer;
}

.add button,
.notify {
    padding: 14px 20px;
    border-radius: 14px;
    color: white;
    font-weight: bold;
    background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
}

/* TASK */

.task {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 5px;
    border-bottom: 1px solid var(--line);
}

.task:last-child {
    border-bottom: none;
}

.task input {
    width: 23px;
    height: 23px;
    cursor: pointer;
    accent-color: var(--green);
}

.task-text {
    flex: 1;
    font-size: 16px;
}

.done {
    text-decoration: line-through;
    color: #999;
}

.delete {
    background: #fff0f0;
    color: var(--red);
    border-radius: 10px;
    padding: 8px 11px;
}

/* DAYS */

.history {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
}

.day {
    padding: 12px 5px;
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    background: white;
}

.day.active {
    border-color: var(--primary);
    background: #f0f0ff;
    color: var(--primary);
}

/* REMINDER */

.reminder {
    background: #fff7df;
    border: 1px solid #ffe4a3;
    color: #805b00;
    border-radius: 14px;
    padding: 13px;
    margin-top: 15px;
}

.empty {
    text-align: center;
    color: #9399a8;
    padding: 30px;
}

.small {
    font-size: 13px;
    color: var(--muted);
    margin-top: 9px;
}

/* TELEFON */

@media(max-width:600px) {

    .container {
        padding: 14px;
    }

    .add {
        flex-direction: column;
    }

    .add button {
        width: 100%;
    }

    .history {
        grid-template-columns: repeat(4, 1fr);
    }

    header h1 {
        font-size: 28px;
    }

}
</style>
</head>

<body>

<div class="container">

<header>

<h1>🌅 Taskurile mele</h1>

<div class="date" id="today"></div>

<div class="progress">
    <div class="bar" id="bar"></div>
</div>

<div id="progressText">
    0 din 0 sarcini îndeplinite
</div>

<div class="reminder" id="reminder" style="display:none"></div>

</header>


<!-- ADAUGARE -->

<div class="card">

<h3>➕ Adaugă o sarcină</h3>

<div class="add">

<input
    id="taskInput"
    placeholder="Ex: Mă trezesc la 08:00"
>

<button onclick="addTask()">
    Adaugă
</button>

</div>

<div class="small">
Poți apăsa Enter pentru a adăuga.
</div>

</div>


<!-- ISTORIC -->

<div class="card">

<h3>📅 Ultimele zile</h3>

<div
    class="history"
    id="history">
</div>

</div>


<!-- TASKURI -->

<div class="card">

<h3 id="listTitle">
Sarcinile de azi
</h3>

<div id="tasks"></div>

</div>


<!-- NOTIFICARI -->

<div class="card">

<h3>🔔 Amintiri</h3>

<button
    class="notify"
    onclick="requestNotifications()">

    Activează notificările

</button>

<div class="small">
Programul îți poate trimite o notificare dacă ai sarcini rămase.
</div>

</div>

</div>


<script>

/* =========================
   SALVARE
========================= */

const STORAGE_KEY = "task_manager_v1";

let data =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "{}"
    );

let selectedDate = todayKey();


/* =========================
   DATA
========================= */

function todayKey() {

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth() + 1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0");

}


function formatDate(day) {

    const parts = day.split("-");

    const d = new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
    );

    return d.toLocaleDateString(
        "ro-RO",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =========================
   TASKURI
========================= */

function getTasks(day) {

    return data[day] || [];

}


function ensureDay(day) {

    if (!data[day]) {
        data[day] = [];
    }

}


function save() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================
   ADAUGA TASK
========================= */

function addTask() {

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();

    if (!text) return;

    ensureDay(selectedDate);

    data[selectedDate].push({

        id: Date.now(),

        text: text,

        done: false

    });

    save();

    input.value = "";

    render();

}


/* ENTER */

document
.getElementById("taskInput")
.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {
            addTask();
        }

    }
);


/* =========================
   BIFA
========================= */

function toggleTask(id) {

    const task =
        getTasks(selectedDate)
        .find(t => t.id === id);

    if (task) {

        task.done = !task.done;

    }

    save();

    render();

}


/* =========================
   STERGE
========================= */

function deleteTask(id) {

    data[selectedDate] =
        getTasks(selectedDate)
        .filter(t => t.id !== id);

    save();

    render();

}


/* =========================
   SCHIMBA ZIUA
========================= */

function selectDay(day) {

    selectedDate = day;

    render();

}


/* =========================
   AFISARE
========================= */

function render() {

    document
    .getElementById("today")
    .textContent =
        formatDate(todayKey());


    document
    .getElementById("listTitle")
    .textContent =
        selectedDate === todayKey()
        ? "Sarcinile de azi"
        : "Sarcinile din "
        + formatDate(selectedDate);


    const tasks =
        getTasks(selectedDate);

    const box =
        document.getElementById("tasks");


    if (tasks.length === 0) {

        box.innerHTML = `
            <div class="empty">
                Nu ai încă sarcini pentru această zi. ✨
            </div>
        `;

    } else {

        box.innerHTML =
            tasks.map(task => `

            <div class="task">

                <input
                    type="checkbox"
                    ${task.done ? "checked" : ""}
                    onchange="
                        toggleTask(${task.id})
                    "
                >

                <div
                    class="
                    task-text
                    ${task.done ? "done" : ""}
                    "
                >

                    ${escapeHtml(task.text)}

                </div>

                <button
                    class="delete"
                    onclick="
                        deleteTask(${task.id})
                    "
                >

                    Șterge

                </button>

            </div>

        `).join("");

    }


    /* PROGRES */

    const done =
        tasks.filter(t => t.done).length;

    const total =
        tasks.length;

    const percent =
        total
        ? Math.round(done / total * 100)
        : 0;


    document
    .getElementById("bar")
    .style.width =
        percent + "%";


    document
    .getElementById("progressText")
    .textContent =
        `${done} din ${total}
        sarcini îndeplinite (${percent}%)`;


    /* REMINDER */

    const reminder =
        document.getElementById("reminder");

    const remaining =
        tasks.filter(t => !t.done);


    if (
        selectedDate === todayKey()
        &&
        remaining.length
    ) {

        reminder.style.display = "block";

        reminder.textContent =
            `🔔 Ai ${remaining.length}
            ${remaining.length === 1
                ? "sarcină"
                : "sarcini"}
            rămase de făcut.`;

    } else {

        reminder.style.display = "none";

    }


    renderHistory();

}


/* =========================
   ISTORIC
========================= */

function renderHistory() {

    const history =
        document.getElementById("history");

    history.innerHTML = "";


    for (let i = 6; i >= 0; i--) {

        const d = new Date();

        d.setDate(
            d.getDate() - i
        );


        const key =
            d.getFullYear()
            + "-"
            + String(
                d.getMonth() + 1
            ).padStart(2,"0")
            + "-"
            + String(
                d.getDate()
            ).padStart(2,"0");


        const tasks =
            getTasks(key);

        const done =
            tasks.filter(t => t.done).length;


        const element =
            document.createElement("div");


        element.className =
            "day"
            + (
                key === selectedDate
                ? " active"
                : ""
            );


        element.innerHTML = `

            <b>
                ${
                    i === 0
                    ? "Azi"
                    : d.toLocaleDateString(
                        "ro-RO",
                        {weekday:"short"}
                    )
                }
            </b>

            <br>

            <small>
                ${d.getDate()}.
                ${String(
                    d.getMonth()+1
                ).padStart(2,"0")}
            </small>

            <br>

            <small>
                ${done}/${tasks.length}
            </small>

        `;


        element.onclick =
            () => selectDay(key);


        history.appendChild(element);

    }

}


/* =========================
   PROTECTIE HTML
========================= */

function escapeHtml(text) {

    return text.replace(
        /[&<>"']/g,
        function(character) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[character];

        }
    );

}


/* =========================
   NOTIFICARI
========================= */

async function requestNotifications() {

    if (!("Notification" in window)) {

        alert(
            "Browserul nu suportă notificări."
        );

        return;

    }


    const permission =
        await Notification.requestPermission();


    if (permission === "granted") {

        new Notification(
            "Taskurile mele 🔔",
            {
                body:
                    "Notificările au fost activate!"
            }
        );

    }

}


/* =========================
   PORNIRE
========================= */

render();

</script>

</body>
</html>
